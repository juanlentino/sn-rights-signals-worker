# Weekly and grouped. The 7-day cooldown matches .cooldown-accept.json's min_age_days,
# so a Dependabot PR never opens on a version that gate would refuse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # 2026-10-26 (owner): 0.23.0 was published without the SLSA provenance every
    # release since 0.9.13 carried, and the dependency-provenance gate refuses it
    # (sn-remote-mcp-worker PR #81). Skip that one version; a later release is proposed and gated
    # again. Remove this entry once a newer version has landed.
    ignore:
      - dependency-name: "@cloudflare/vitest-pool-workers"
        versions: ["0.23.0"]
      # vitest 5 needs @cloudflare/vitest-pool-workers >= 0.23, which is skipped above
      # (no provenance); lift both together once a pool-workers release with provenance exists.
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
