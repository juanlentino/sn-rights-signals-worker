name: Test suite

on:
  push:
    branches: [main]
  pull_request:
  # Manual only. The live check reads the DEPLOYED site, so it is meaningless
  # on a PR (branch builds don't serve production) and racy on a push to main
  # (this Worker ships via the Workers Builds git integration, which deploys
  # asynchronously after the push lands — v1.14.1 confirmed this path). The
  # `npm run deploy` flow still works and keeps its postdeploy gate; this is
  # the on-demand "is prod still consistent right now?" button.
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the LIVE rights-signal check against juanlentino.com"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only checks out the repo and runs tests. It
# never calls the GitHub API, so read access to contents is all it needs.
permissions:
  contents: read

jobs:
  # ONE job on purpose. Actions bills per job, rounded up to the whole minute,
  # so a second job for a 4-second check would cost a full extra minute every
  # run. Both checks are steps here; the live one is gated and bills nothing
  # when it does not run.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # R6c dependency-provenance gate. A STEP, not a job: Actions bills per job
      # rounded up to the whole minute, so a separate job for a ~3s check would
      # cost a full extra minute on every run for no added signal.
      #
      # node 24 is pinned above BECAUSE of this gate: it needs npm >= 11. npm 10
      # accepts --include-attestations but silently omits the `verified` array,
      # which would make every package read as unattested. The gate asserts that
      # rather than trusting it, and exits 2 with a clear message if npm is old.
      - name: Dependency-provenance gate
        run: node scripts/attestation-gate.mjs
      # R6c leg 2: minimum-age cooldown (see sn-remote-mcp-worker v1.1.0 for
      # the full rationale). No locked version younger than min_age_days;
      # deliberate young bumps are accepted per version in
      # .cooldown-accept.json with a reason. Fail-closed on unmeasured ages.
      - name: Dependency cooldown gate
        run: node scripts/dependency-cooldown.mjs
      # Every outbound call in src/ must either set redirect:"manual"/"error" or
      # carry a `redirect-ok:` comment saying why it needs no guard. A NEW call
      # site fails until classified. A step, not a job: per-job billing rounds up,
      # and this runs in ~1s. Plain Node on purpose — this repo's vitest may run
      # inside workerd, where the parser's native binding cannot load.
      - name: Outbound redirect gate
        run: node scripts/outbound-redirect-gate.mjs
      # Includes test/rights-consistency.test.mjs — the STATIC rights check:
      # drives the real Worker over a stubbed origin and asserts all four
      # signal layers agree as composed. Fails the PR on drift.
      - run: npm test
      - name: Live rights-signal check (deployed site)
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: npm run check:live
